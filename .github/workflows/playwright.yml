name: Playwright Test

on:
  pull_request:
    types: [closed]
    branches: [ test ]

permissions:
  pull-requests: write
  contents: read

jobs:
  test:
    if: github.event.pull_request.merged == true
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install

      # ✅ Run tests and capture logs + exit code
      - name: Run Playwright tests
        id: test_run
        run: |
          npx playwright test | tee result.txt
          echo "EXIT_CODE=$?" >> $GITHUB_ENV

      # ✅ Extract last lines (real error snippet)
      - name: Extract error logs
        id: error
        run: |
          tail -n 30 result.txt > error.txt

      # ✅ Decide pass/fail
      - name: Read result
        id: result
        run: |
          if [ "$EXIT_CODE" -ne 0 ]; then
            echo "status=❌ Failed" >> $GITHUB_OUTPUT
          else
            echo "status=✅ Passed" >> $GITHUB_OUTPUT
          fi

      # ✅ Comment on PR with real error
      - name: Comment on PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const result = "${{ steps.result.outputs.status }}";
            let errorLog = "";
            try {
              errorLog = fs.readFileSync('error.txt', 'utf8');
            } catch (e) {
              errorLog = "No error log found";
            }

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `Playwright Test Result: ${result}

\`\`\`
${errorLog}
\`\`\``
            });